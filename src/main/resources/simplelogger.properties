# SLF4J simple logger. The TUI owns the terminal, so nothing may be written to
# stderr while it runs: AgentApp redirects the log to a file at startup (see
# AgentApp.configureLogging) and the default level is WARN so library chatter
# (langchain4j-agentic planner, MCP client) never reaches the screen.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
# Turn these up when debugging the agentic system (or set KAFKA_AGENT_LOG_LEVEL):
# org.slf4j.simpleLogger.log.dev.langchain4j.agentic=info
# org.slf4j.simpleLogger.log.dev.langchain4j.mcp=debug
